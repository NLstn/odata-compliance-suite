name: Reference compliance run

# Runs the full suite against the pinned go-odata reference implementation.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  reference:
    name: Run suite vs go-odata
    runs-on: ubuntu-latest
    steps:
      - name: Check out suite
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The reference compliance server requires Go 1.25; this also
          # satisfies the suite's own 1.24 requirement.
          go-version: '1.25'

      - name: Run compliance suite against go-odata reference server
        env:
          # Pin the go-odata commit that implements the 4.02 behavior exercised here.
          GO_ODATA_REF: 7f1f4237f5dad37bdcd9ea5fae3a25bc09a88285
        run: ./scripts/run-reference.sh -verbose
