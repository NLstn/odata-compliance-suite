name: Reference compliance run

# Runs the suites supported by the pinned go-odata reference implementation.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  reference:
    name: Run suite vs go-odata
    runs-on: ubuntu-latest
    steps:
      - name: Check out suite
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The reference compliance server requires Go 1.25; this also
          # satisfies the suite's own 1.24 requirement.
          go-version: '1.25'

      - name: Run compliance suite against go-odata reference server
        env:
          # Immutable reference baseline includes the fixes in NLstn/go-odata#950.
          # Pinning allows coordinated server/suite fixes to pass before either merges.
          GO_ODATA_REF: 573ce8651ca3370fc7a948d87f0de9536a70fc12
        # The pinned reference predates 4.02. Run all versions after the pin advances.
        run: |
          for protocol_version in 4.0 4.01 vocabularies; do
            ./scripts/run-reference.sh -version "$protocol_version" -verbose
          done
